# =============================================================================
#  Nginx como PROXY INVERSO: la única puerta de entrada desde fuera.
#
#    http://localhost:8080/        ->  contenedor "web" (puerto 3000)
#    http://localhost:8080/api/... ->  contenedor "api" (puerto 5000)
#    http://localhost:8080/salud   ->  respuesta del propio nginx (healthcheck)
#
#  Los nombres "web" y "api" los resuelve el DNS interno de Docker.
#  OJO: nginx los resuelve UNA vez al arrancar. Si recreas el contenedor de la
#  API (cambia su IP), reinicia también el proxy: docker compose restart proxy
# =============================================================================
server {
    listen 80;
    server_name _;

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
